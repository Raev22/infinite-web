  <!-- Chrono shard -->
  <g>
    <circle cx="336" cy="48" r="33" fill="#b76bff" fill-opacity=".06"/>
    <path d="M336 18 359 31v27l-23 13-23-13V31Z" fill="#b76bff" fill-opacity=".1" stroke="#b76bff" stroke-width="3"/>
