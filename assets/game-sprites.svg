      <stop offset="1" stop-color="#111219"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#42434f"/>
      <stop offset="1" stop-color="#15161f"/>
