    <ellipse cx="62" cy="62" rx="5.5" ry="7" fill="#090a10"/>
    <circle cx="63.5" cy="31" r="1.8" fill="#fff"/>
    <circle cx="63.5" cy="60" r="1.8" fill="#fff"/>
    <path d="M76 44h5M76 51h5" stroke="#c2ff00" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Regular food -->
  <g>
    <circle cx="240" cy="48" r="33" fill="#ffd447" fill-opacity=".06"/>
    <path d="m240 17 30 31-30 31-30-31Z" fill="#ffd447" fill-opacity=".12" stroke="#ffd447" stroke-width="3"/>
    <path d="m240 32 16 16-16 16-16-16Z" fill="none" stroke="#fff4c2" stroke-opacity=".82" stroke-width="2.5"/>
    <circle cx="240" cy="48" r="3" fill="#ffd447"/>
